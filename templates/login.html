<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://static.vecteezy.com/system/resources/thumbnails/040/890/255/small_2x/ai-generated-empty-wooden-table-on-the-natural-background-for-product-display-free-photo.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Background Animation */
        .background-animation {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(100px);
            animation: moveBackground 8s infinite alternate ease-in-out;
        }

        @keyframes moveBackground {
            from { transform: translateX(-50px) translateY(-50px); }
            to { transform: translateX(50px) translateY(50px); }
        }

        /* Glassmorphism Effect */
        .glass-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        /* Heading Animation */
        .animated-heading {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff416c, #ff4b2b, #ffeb3b, #ff6e7f, #42e695);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 3s infinite linear, bounceIn 1s ease-in-out;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Button Animation */
        .btn-custom {
            background: #e50914;
            color: white;
            font-size: 16px;
            padding: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
            width: 100%;
        }

        .btn-custom:hover {
            background: #b20710;
            transform: scale(1.05);
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="background-animation" style="top: 20%; left: 10%;"></div>
    <div class="background-animation" style="bottom: 30%; right: 15%;"></div>

    <div class="glass-container">
        <h2 id="form-title" class="animated-heading">Login</h2>
        
        <!-- Login Form -->
        <form id="login-form">
            <input type="email" class="form-control mb-3" placeholder="Email" required>
            <input type="password" class="form-control mb-3" placeholder="Password" required>
            <button type="submit" class="btn-custom">Sign In</button>
            <p class="mt-3 text-white">Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></p>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" style="display: none;">
            <h2 class="animated-heading">Sign Up</h2>
            <input type="text" class="form-control mb-3" placeholder="Full Name" required>
            <input type="email" class="form-control mb-3" placeholder="Email" required>
            <input type="password" class="form-control mb-3" placeholder="Password" required>
            <input type="tel" class="form-control mb-3" placeholder="Mobile Number" required>
            <button type="submit" class="btn-custom">Sign Up</button>
            <p class="mt-3 text-white">Already have an account? <a href="#" onclick="toggleForm()">Login</a></p>
        </form>
    </div>

    <script>
        function toggleForm() {
            let loginForm = document.getElementById('login-form');
            let signupForm = document.getElementById('signup-form');
            let title = document.getElementById('form-title');

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                title.innerText = 'Login';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                title.innerText = 'Sign Up';
            }
        }
    </script>

</body>
</html>
